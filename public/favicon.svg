<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Perceptron Lab mark: three inputs, one neuron, instrument ticks -->
  <rect width="64" height="64" rx="12" fill="#15161c"/>
  <!-- corner ticks -->
  <g stroke="#e8e3d4" stroke-opacity="0.35" stroke-width="2">
    <path d="M10 16v-6h6"/>
    <path d="M54 48v6h-6"/>
  </g>
  <!-- input edges -->
  <g stroke="#e8e3d4" stroke-opacity="0.55" stroke-width="2.5">
    <line x1="18" y1="17" x2="41" y2="30"/>
    <line x1="18" y1="32" x2="41" y2="32"/>
    <line x1="18" y1="47" x2="41" y2="34"/>
  </g>
  <!-- input nodes -->
  <g fill="#e8e3d4" fill-opacity="0.8">
    <circle cx="16" cy="17" r="4"/>
    <circle cx="16" cy="32" r="4"/>
    <circle cx="16" cy="47" r="4"/>
  </g>
  <!-- the neuron -->
  <circle cx="45" cy="32" r="8.5" fill="#7d9eff"/>
  <circle cx="45" cy="32" r="12.5" fill="none" stroke="#7d9eff" stroke-opacity="0.35" stroke-width="2"/>
</svg>
